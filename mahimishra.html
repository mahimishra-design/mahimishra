
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mahi Mishra | Golden Elegance</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background:
                radial-gradient(ellipse at center, #263b36 0%, #101b19 48%, #070b0a 100%);
            font-family: Georgia, "Times New Roman", serif;
            color: #f5d58a;
        }

        /* Floating golden particles */
        .particles {
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            bottom: -20px;
            left: var(--x);
            width: var(--size);
            height: var(--size);
            background: #f8d98b;
            border-radius: 50%;
            box-shadow: 0 0 12px #f5c76a;
            opacity: 0;
            animation: floatUp var(--duration) linear infinite;
            animation-delay: var(--delay);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(.4);
                opacity: 0;
            }
            15% { opacity: .8; }
            85% { opacity: .5; }
            100% {
                transform: translateY(-110vh) scale(1.3);
                opacity: 0;
            }
        }

        /* Main decorative frame */
        .frame {
            position: relative;
            width: min(90%, 1000px);
            min-height: 430px;
            padding: 15px;
            border: 4px double #d5ad62;
            outline: 1px solid rgba(245, 215, 145, .45);
            outline-offset: 8px;
            box-shadow:
                0 0 25px rgba(222, 178, 94, .16),
                inset 0 0 35px rgba(0, 0, 0, .4);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: frameAppear 1.5s ease both;
        }

        .inner-frame {
            position: relative;
            width: 100%;
            min-height: 390px;
            border: 1px solid rgba(229, 194, 122, .6);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 35px 15px;
        }

        .corner {
            position: absolute;
            font-size: 30px;
            color: #f4d18b;
            text-shadow: 0 0 15px #d5ad62;
        }

        .top-left { top: 7px; left: 10px; }
        .top-right { top: 7px; right: 10px; }
        .bottom-left { bottom: 7px; left: 10px; }
        .bottom-right { bottom: 7px; right: 10px; }

        .eyebrow {
            font-family: Arial, sans-serif;
            font-size: 11px;
            letter-spacing: 7px;
            text-transform: uppercase;
            margin-bottom: 27px;
            color: #d8c49a;
            animation: fadeIn 1.5s ease both;
        }

        .name {
            font-size: clamp(38px, 8vw, 92px);
            font-weight: bold;
            letter-spacing: clamp(3px, 1vw, 11px);
            line-height: 1.2;
            text-transform: uppercase;
            background: linear-gradient(
                110deg,
                #94703a,
                #fff0b8,
                #d5a64e,
                #fff7d5,
                #9b7135
            );
            background-size: 250% auto;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 12px rgba(235, 193, 103, .22));
            animation: goldShine 5s linear infinite,
                       nameAppear 1.8s cubic-bezier(.2, .8, .2, 1) both;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 15px;
            width: min(350px, 80%);
            margin: 28px 0 20px;
            color: #e5c47f;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, #d7b66e);
        }

        .divider::after {
            background: linear-gradient(90deg, #d7b66e, transparent);
        }

        .star {
            font-size: 20px;
            animation: sparkle 2s ease-in-out infinite;
        }

        .tagline {
            font-size: clamp(12px, 2vw, 16px);
            letter-spacing: 4px;
            color: #e0cfaa;
            text-transform: uppercase;
            animation: fadeIn 2.5s ease both;
        }

        .year {
            position: absolute;
            bottom: 18px;
            font-family: Arial, sans-serif;
            font-size: 9px;
            letter-spacing: 4px;
            color: #9d8b67;
        }

        @keyframes goldShine {
            to { background-position: 250% center; }
        }

        @keyframes nameAppear {
            from {
                opacity: 0;
                transform: translateY(35px) scale(.9);
                letter-spacing: 20px;
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes frameAppear {
            from {
                opacity: 0;
                transform: scale(.92);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes sparkle {
            0%, 100% {
                transform: scale(1);
                opacity: .7;
            }
            50% {
                transform: scale(1.4);
                opacity: 1;
                text-shadow: 0 0 18px #ffe9a7;
            }
        }

        @media (max-width: 500px) {
            .frame {
                min-height: 350px;
                padding: 9px;
            }

            .inner-frame {
                min-height: 320px;
            }

            .eyebrow {
                letter-spacing: 4px;
            }

            .tagline {
                letter-spacing: 2px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
            }
        }
    </style>
</head>

<body>

    <div class="particles" id="particles"></div>

    <main class="frame">
        <section class="inner-frame">

            <span class="corner top-left">❧</span>
            <span class="corner top-right">❧</span>
            <span class="corner bottom-left">❧</span>
            <span class="corner bottom-right">❧</span>

            <p class="eyebrow">A Name • A Signature • A Legacy</p>

            <h1 class="name">Mahi Mishra</h1>

            <div class="divider">
                <span class="star">✧</span>
                <span>❖</span>
                <span class="star">✧</span>
            </div>

            <p class="tagline">Elegance Beyond Time</p>

            <p class="year">✦ MADE TO STAND OUT ✦</p>

        </section>
    </main>

    <script>
        const particleBox = document.getElementById("particles");

        for (let i = 0; i < 35; i++) {
            const particle = document.createElement("span");
            particle.className = "particle";

            particle.style.setProperty("--x", Math.random() * 100 + "%");
            particle.style.setProperty("--size", (2 + Math.random() * 4) + "px");
            particle.style.setProperty("--duration", (7 + Math.random() * 12) + "s");
            particle.style.setProperty("--delay", (-Math.random() * 18) + "s");

            particleBox.appendChild(particle);
        }
    </script>

</body>
</html>
